<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universe — PHARMA 3D</title>
<meta name="description" content="The Pharmacy Universe: an interactive map of 18 pharmacy domains and how they connect. Filter by Discovery, Development, Delivery, Safety and Care.">
<meta name="theme-color" content="#1F2E2C">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHARMA 3D">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/universe.css">
<link rel="stylesheet" href="css/domain.css">
<link rel="stylesheet" href="css/search.css">
</head>
<body>

<div data-include="header"></div>
<div data-include="mobile-nav"></div>
<div data-include="search-modal"></div>
<div data-include="a11y-drawer"></div>

<main id="main-content">
  <div class="breadcrumb-bar">
    <nav class="breadcrumbs container" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">Universe</span>
    </nav>
  </div>

  <section class="container universe-head">
    <span class="section-eyebrow">Pharmacy Universe</span>
    <h1>Eighteen domains, one connected world</h1>
    <p class="lead">
      Explore how the domains of pharmacy relate to each other. Tap a circle for a summary and a link to its full page,
      filter by stage, or switch to List view for a text-only alternative.
    </p>
  </section>

  <section class="container section" style="padding-top:0;">
    <div id="universe-app" aria-live="polite">
      <noscript>
        <p>The interactive map needs JavaScript. All domain pages are still reachable from the <a href="explore.html">Explore hub</a>.</p>
      </noscript>
      <div class="state-block"><p>Loading the Universe…</p></div>
    </div>
  </section>
</main>

<div data-include="footer"></div>
<div data-include="bottom-nav"></div>

<script src="js/paths.js"></script>
<script src="js/icons.js"></script>
<script src="js/search-index.js"></script>
<script src="js/partials.js"></script>
<script src="js/app.js"></script>
<script src="js/data-store.js"></script>
<script src="js/related.js"></script>
<script src="js/universe.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
<script src="js/search.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then((reg) => { if (window.pharma3dWatchForUpdates) window.pharma3dWatchForUpdates(reg); }).catch(() => {});
    });
  }
</script>
</body>
</html>
